sentence=Board example sketches for the dsPIC33CK Arduino platform
paragraph=Carries the platform's example sketches so the IDE can find them. Arduino builds File > Examples from libraries only -- a platform-level examples/ folder is never scanned -- so board examples have to live inside a bundled library. This is the same arrangement arduino-esp32 uses for its libraries/ESP32 examples. Including the header is equivalent to including Arduino.h.
